<!DOCTYPE html>
<html>
<head>
    <title>Google Sign-In Test</title>
    <!-- Update Firebase SDK versions to latest -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
</head>
<body>
    <h2>Google Sign-In Test</h2>
    <button id="googleSignIn">Sign in with Google</button>
    <button id="signOut" style="display: none;">Sign Out</button>
    <pre id="userInfo"></pre>
    <pre id="tokenInfo"></pre>

    <script>
        // Replace with your Firebase config from Firebase Console -> Project Settings -> Web App
        const firebaseConfig = {
            apiKey: "AIzaSyBT5DSGYayA1wg2ytvao_SCb52fpxYmxCI",
  authDomain: "research-igaming.firebaseapp.com",
  projectId: "research-igaming",
  storageBucket: "research-igaming.firebasestorage.app",
  messagingSenderId: "124345080434",
  appId: "1:124345080434:web:18f73d546bf69a0cce40eb",
  measurementId: "G-L56PG899EN"
        };

        // Initialize Firebase
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();

        // DOM elements
        const googleBtn = document.getElementById('googleSignIn');
        const signOutBtn = document.getElementById('signOut');
        const userInfo = document.getElementById('userInfo');
        const tokenInfo = document.getElementById('tokenInfo');

        // Sign in with Google
        googleBtn.addEventListener('click', async () => {
            try {
                const provider = new firebase.auth.GoogleAuthProvider();
                const result = await auth.signInWithPopup(provider);
                const idToken = await result.user.getIdToken();
                
                console.log('ID Token:', idToken); // For debugging

                // Send token to backend
                const response = await fetch('http://localhost:8000/api/auth/google', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ idToken })
                });

                const data = await response.json();
                console.log('Backend response:', data); // For debugging

                if (response.ok) {
                    localStorage.setItem('token', data.token);
                    displayUserInfo(data.user);
                    displayTokenInfo(data.token);
                } else {
                    throw new Error(data.error || 'Sign-in failed');
                }
            } catch (error) {
                console.error('Error:', error);
                userInfo.textContent = `Error: ${error.message}`;
            }
        });

        // Sign out
        signOutBtn.addEventListener('click', () => {
            auth.signOut();
            localStorage.removeItem('token');
            userInfo.textContent = '';
            tokenInfo.textContent = '';
            googleBtn.style.display = 'block';
            signOutBtn.style.display = 'none';
        });

        // Display user info
        function displayUserInfo(user) {
            userInfo.textContent = JSON.stringify(user, null, 2);
            googleBtn.style.display = 'none';
            signOutBtn.style.display = 'block';
        }

        // Display token info
        function displayTokenInfo(token) {
            tokenInfo.textContent = `JWT Token: ${token}`;
        }
    </script>
</body>
</html>
